<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (Samsung One UI friendly) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner circle glow -->
  <circle cx="256" cy="256" r="210" fill="#ffffff" opacity="0.08"/>

  <!-- Main Speech Bubble -->
  <g filter="url(#shadow)">
    <path d="M 120 160 C 120 120, 150 100, 200 100 L 312 100 C 362 100, 392 120, 392 160 L 392 260 C 392 300, 362 320, 312 320 L 220 320 L 160 375 L 175 320 L 200 320 C 150 320, 120 300, 120 260 Z" fill="url(#bubbleGrad)"/>
  </g>

  <!-- Stethoscope / Medical Heartbeat + Iraqi Dialogue Symbol -->
  <!-- Cute Friendly Face / Owl Mascot details inside the bubble -->
  <!-- Left Eye -->
  <circle cx="215" cy="205" r="22" fill="#0f172a"/>
  <circle cx="221" cy="199" r="8" fill="#ffffff"/>
  
  <!-- Right Eye -->
  <circle cx="297" cy="205" r="22" fill="#0f172a"/>
  <circle cx="303" cy="199" r="8" fill="#ffffff"/>

  <!-- Cheerful Smile -->
  <path d="M 232 242 Q 256 265 280 242" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>

  <!-- Warm Blush Cheeks -->
  <ellipse cx="185" cy="225" rx="14" ry="8" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="327" cy="225" rx="14" ry="8" fill="#f43f5e" opacity="0.4"/>

  <!-- Little Stethoscope badge on bottom right -->
  <circle cx="370" cy="370" r="60" fill="#10b981" filter="url(#shadow)"/>
  <text x="370" y="388" font-size="52" text-anchor="middle" font-family="Arial, sans-serif">🩺</text>

  <!-- Kurdish Sorani & Iraqi text -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    یەڵڵا عەرەبی
  </text>
</svg>
